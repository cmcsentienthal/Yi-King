    <rect x="56"  y="55"  width="175" height="52" rx="18"/>
    <rect x="281" y="55"  width="175" height="52" rx="18"/>
    <rect x="56"  y="125" width="175" height="52" rx="18"/>
    <rect x="281" y="125" width="175" height="52" rx="18"/>
    <rect x="56"  y="195" width="175" height="52" rx="18"/>
    <rect x="281" y="195" width="175" height="52" rx="18"/>
    <rect x="56"  y="265" width="400" height="52" rx="18"/>
    <rect x="56"  y="335" width="400" height="52" rx="18"/>
    <rect x="56"  y="405" width="400" height="52" rx="18"/>
