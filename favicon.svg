<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fond" x1="0" y1="512" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFD21F"/>
      <stop offset="38%"  stop-color="#FF9A1F"/>
      <stop offset="72%"  stop-color="#F0433A"/>
      <stop offset="100%" stop-color="#E8306B"/>
